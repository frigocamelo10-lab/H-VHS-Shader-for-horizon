
schema = 1
id = "vhs99"
name = "VHS Camera for Horizon"
version = "3.3.0"
api = "0.1"
description = "Analog VHS camera simulation with JPEG compression artifacts, film grain, scanlines, lens effects, bloom and subtle movement."

[[post]]
file = "post/vhs.wgsl"
name = "VHS Camera"

[[post]]
file = "post/motion.wgsl"
name = "Camera Motion"

[[pages]]
id = "main"
name = "VHS Camera"
items = ["vhs_enabled", "vhs_screen_type", "page:film", "page:analog", "page:compression", "page:bloom", "page:motion"]

[[pages]]
id = "film"
name = "Film & Lens"
items = ["vhs_grain", "vhs_dark_grain", "vhs_grain_speed", "vhs_chromatic", "vhs_achromatic", "vhs_vignette"]

[[pages]]
id = "analog"
name = "Analog Effects"
items = ["vhs_scanlines", "vhs_scanline_fine", "vhs_flicker", "vhs_tape_noise", "vhs_dropout", "vhs_overlay_strength"]

[[pages]]
id = "compression"
name = "JPEG Simulation"
items = ["vhs_jpeg_compression", "vhs_jpeg_blocks", "vhs_color_artifacts", "vhs_desaturation"]

[[pages]]
id = "bloom"
name = "Light & Bloom"
items = ["vhs_bloom_strength", "vhs_bloom_threshold", "vhs_bloom_radius", "vhs_bloom_depth", "vhs_highlight_boost", "vhs_bottom_noise_strength"]

[[pages]]
id = "motion"
name = "Camera Motion"
items = ["motion_enabled", "motion_idle_strength", "motion_walk_strength", "motion_run_strength"]

[[options]]
id = "vhs_enabled"
name = "VHS Effect"
type = "bool"
default = true

[[options]]
id = "vhs_screen_type"
name = "Screen Type"
type = "choice"
values = ["16:9", "4:3", "1:1"]
default = "4:3"

[[options]]
